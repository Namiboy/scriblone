<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>scriblone Share-Test</title>
<style>
  body { font: 18px -apple-system, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 16px; background: #fff; color: #111; }
  button, a.btn { display: block; width: 100%; margin: .6rem 0; padding: .9rem; font-size: 1.1rem; border-radius: .6rem; border: 1px solid #888; background: #f2f2f2; color: #111; text-align: center; text-decoration: none; }
  #log { white-space: pre-wrap; font-size: .9rem; background: #f6f6f6; padding: .6rem; border-radius: .4rem; }
</style>
</head>
<body>
<h1>Share-Test</h1>
<p id="mode"></p>
<label>MIME-Typ:
  <select id="mime">
    <option value="application/octet-stream">application/octet-stream</option>
    <option value="">"" (leer)</option>
  </select>
</label>
<button id="prep">1. Datei vorbereiten</button>
<button id="share" disabled>2. Teilen</button>
<a class="btn" href="spike-C.goodnotes" download="spike-C.goodnotes">Download-Link (Weg 3)</a>
<div id="log"></div>
<script>
  const $ = (id) => document.getElementById(id), log = (m) => ($('log').textContent += m + '\n');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('mode').textContent = standalone ? 'Läuft als installierte App ✔' : '⚠ Läuft im Safari-Tab – bitte erst „Zum Home-Bildschirm“ und von dort öffnen.';
  let file;
  // Separate taps: the share call must keep the transient user activation, so the fetch happens before.
  $('prep').onclick = async () => {
    try {
      const buf = await (await fetch('spike-C.goodnotes', { cache: 'no-store' })).arrayBuffer();
      file = new File([buf], 'spike-C.goodnotes', { type: $('mime').value });
      const ok = navigator.canShare?.({ files: [file] });
      log(`vorbereitet: ${buf.byteLength} B, MIME "${file.type}", canShare=${ok}`);
      $('share').disabled = false;
    } catch (e) { log('Fehler beim Laden: ' + e); }
  };
  $('share').onclick = async () => {
    try { await navigator.share({ files: [file] }); log(`geteilt (MIME "${file.type}")`); }
    catch (e) { log(`share fehlgeschlagen (MIME "${file.type}"): ${e.name} ${e.message}`); }
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
